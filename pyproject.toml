[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-sync"
dynamic = ["version"]
description = "Download YouTube playlists as clean, tagged music files and keep .m3u8 playlists in sync."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["yt-dlp", "rich", "questionary", "mutagen", "imageio-ffmpeg"]

[project.scripts]
ytmusic-sync = "ytmusic_sync.cli:main"

[tool.setuptools]
packages = ["ytmusic_sync"]

[tool.setuptools.dynamic]
version = { attr = "ytmusic_sync.__version__" }
