[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-sync"
version = "0.1"
description = "Download YouTube playlists as clean, tagged music files and keep .m3u8 playlists in sync."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["yt-dlp", "rich", "questionary", "mutagen", "platformdirs", "imageio-ffmpeg"]

[project.scripts]
ytmusic-sync = "ytmusic_sync:main"

[tool.setuptools]
py-modules = ["ytmusic_sync"]
